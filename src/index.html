<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pleph</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="vendor/highlight.min.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="titlebar" data-tauri-drag-region></div>
      <div class="side-head">
        <button class="folder-btn" id="folder-btn" title="Open folder (⌘O)">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M1.75 3.5c0-.55.45-1 1-1h3.1l1.4 1.5h6c.55 0 1 .45 1 1v7.25c0 .55-.45 1-1 1H2.75c-.55 0-1-.45-1-1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span id="folder-name">Open folder…</span>
        </button>
      </div>
      <div class="filter-wrap">
        <svg viewBox="0 0 16 16" width="13" height="13"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="filter" type="search" placeholder="Filter files" spellcheck="false" autocomplete="off" />
        <kbd>⌘P</kbd>
      </div>
      <nav class="tree" id="tree" tabindex="-1"></nav>
      <div class="side-foot">
        <span id="stats"></span>
        <button class="icon-btn" id="theme-btn" title="Theme"></button>
      </div>
      <div class="resizer" id="resizer"></div>
    </aside>

    <main class="main">
      <header class="topbar" data-tauri-drag-region>
        <div class="crumbs" id="crumbs"></div>
      </header>
      <div class="scroller" id="scroller">
        <article class="doc" id="doc"></article>
      </div>
    </main>
  </div>
</body>
</html>
